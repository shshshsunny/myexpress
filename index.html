<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>物價紀錄管理</title>
  <style>
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; padding:20px; }
    label { display:inline-block; width:90px; }
    input { margin-bottom:8px; }
    button { margin-right:8px; }
    table { width:100%; border-collapse:collapse; margin-top:16px; }
    th, td { border:1px solid #ddd; padding:8px; text-align:left; }
    th { background:#f4f4f4; }
    #message { margin-top:12px; font-weight:600; }
  </style>
</head>
<body>
  <h1>物價紀錄管理</h1>

  <form id="priceForm">
    <div>
      <label for="record_date">日期</label>
      <input id="record_date" name="record_date" type="date" required />
    </div>
    <div>
      <label for="item_name">品項名稱</label>
      <input id="item_name" name="item_name" type="text" required />
    </div>
    <div>
      <label for="item_price">商品價格</label>
      <input id="item_price" name="item_price" type="number" required />
    </div>

    <div>
      <button type="submit" data-method="get">GET 新增</button>
      <button type="submit" data-method="post">POST 新增</button>
    </div>
  </form>

  <p id="message"></p>

  <h2>物價清單</h2>
  <table id="pricesTable">
    <thead>
      <tr><th>日期</th><th>品項</th><th>價格</th></tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
    const form = document.getElementById('priceForm');
    const messageEl = document.getElementById('message');
    const tbody = document.querySelector('#pricesTable tbody');

    const API_BASE = 'http://localhost:3000';

    async function fetchPrices() {
      try {
        const res = await fetch(API_BASE + '/api/prices');
        if (!res.ok) throw new Error('fetch prices failed: ' + res.status);
        const data = await res.json();
        populateTable(data);
      } catch (e) {
        console.error(e);
        messageEl.textContent = '載入物價清單失敗：' + e.message;
      }
    }

    function populateTable(items) {
      tbody.innerHTML = '';
      for (const row of items) {
        const tr = document.createElement('tr');
        const tdDate = document.createElement('td'); tdDate.textContent = row.record_date || '';
        const tdName = document.createElement('td'); tdName.textContent = row.item_name || '';
        const tdPrice = document.createElement('td'); tdPrice.textContent = row.item_price != null ? row.item_price : '';
        tr.appendChild(tdDate); tr.appendChild(tdName); tr.appendChild(tdPrice);
        tbody.appendChild(tr);
      }
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      messageEl.textContent = '';
      const submitter = e.submitter || document.activeElement;
      const method = submitter && submitter.dataset && submitter.dataset.method ? submitter.dataset.method.toLowerCase() : 'post';

      const date = document.getElementById('record_date').value;
      const name = document.getElementById('item_name').value.trim();
      const price = document.getElementById('item_price').value;

      if (!date || !name || price === '') {
        messageEl.textContent = '請填寫所有欄位';
        return;
      }

      try {
        if (method === 'get') {
          const qs = `?date=${encodeURIComponent(date)}&name=${encodeURIComponent(name)}&price=${encodeURIComponent(price)}`;
          const res = await fetch(API_BASE + '/api/insert' + qs, { method: 'GET' });
          const text = await res.text();
          messageEl.textContent = text;
        } else {
          const res = await fetch(API_BASE + '/api/insert', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ date, name, price: Number(price) })
          });
          const text = await res.text();
          messageEl.textContent = text;
        }

        // after insert, refresh table
        await fetchPrices();
      } catch (err) {
        console.error(err);
        messageEl.textContent = '新增失敗：' + (err.message || err);
      }
    });

    document.addEventListener('DOMContentLoaded', () => {
      fetchPrices();
    });
  </script>
</body>
</html>
